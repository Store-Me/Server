<!DOCTYPE html>
<html>
<head>
</head>
<body onload="sample2_execDaumPostcode()">

<div id="layer" style="display:block;position:fixed;overflow:hidden;z-index:1;-webkit-overflow-scrolling:touch;">
</div>

<!-- 다음 우편번호 API 호출 -->
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
  // theme 객체 정의
  const themeObj = {
    bgColor: "#F7F7F7",          // 바탕 배경색
    contentBgColor: "#FFFFFF",   // 본문 배경색
    textColor: "#000000",        // 기본 글자색
    postcodeTextColor: "#FF5733",// 우편번호 강조 색상
    emphTextColor: "#0068B7",    // 강조 텍스트 색상
    outlineColor: "#E0E0E0"      // 테두리 색상
  };

  // 우편번호 찾기 화면을 넣을 element
  var element_layer = document.getElementById('layer');

  function sample2_execDaumPostcode() {
    new daum.Postcode({
      oncomplete: function(data) {
        // 법정동과 도로명 주소 추출
        var roadAddress = data.roadAddress;  // 도로명 주소
        var legalDong = data.bname || "";    // 법정동 (없으면 빈 문자열)
        var administrativeDong = data.hname || "";  //행정동
        var sigunguCode = data.sigunguCode || "";   //시군구코드

        if(data.buildingName !== '') {
          roadAddress += ' (' + data.buildingName + ')';
        }

        // 데이터를 JSON 형식으로 가공
        var addressData = JSON.stringify({
          roadAddress: roadAddress,
          legalDong: legalDong,
          administrativeDong: administrativeDong,
          sigunguCode: sigunguCode
        });

        // JSON 데이터를 안드로이드로 전달
        window.StoreMe.processDATA(addressData);
      },
      width: '100%',
      height: '100%',
      theme: themeObj   //테마 설정
    }).embed(element_layer);

    // iframe을 넣은 element를 보이게 한다.
    element_layer.style.display = 'block';
    initLayerPosition();
  }

  // 레이어 위치 조정 함수
  function initLayerPosition(){
    var width = (window.innerWidth || document.documentElement.clientWidth);
    var height = (window.innerHeight || document.documentElement.clientHeight);
    var borderWidth = 5; //샘플에서 사용하는 border의 두께

    element_layer.style.width = width + 'px';
    element_layer.style.height = height + 'px';
    element_layer.style.border = borderWidth + 'px solid';
    element_layer.style.left = (((window.innerWidth || document.documentElement.clientWidth) - width)/2 - borderWidth) + 'px';
    element_layer.style.top = (((window.innerHeight || document.documentElement.clientHeight) - height)/2 - borderWidth) + 'px';
  }
</script>
</body>
</html>
